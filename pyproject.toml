[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gencedula"
version = "1.0.0"
description = "Generate and verify Uruguayan identity document numbers."
readme = "README.md"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    {name = "Carlos A. Planchón", email = "carlosandresplanchonprestes@gmail.com"}
]
keywords = [
    "generate",
    "uruguay",
    "identification",
    "document",
    "verify",
    "number",
    "cedula"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed"
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/carlosplanchon/gencedula"
Repository = "https://github.com/carlosplanchon/gencedula"
Issues = "https://github.com/carlosplanchon/gencedula/issues"

[tool.setuptools]
packages = ["gencedula"]

[tool.setuptools.package-data]
gencedula = ["py.typed"]
